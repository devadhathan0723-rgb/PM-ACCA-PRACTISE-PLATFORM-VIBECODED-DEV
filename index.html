<script>
"use strict";
const EXAM=10800,KEY="acca-pm-simulator-26-27";
const q=(id,sec,sc,p,opts,k,why,wrong,topic)=>({id,sec,sc,p,opts,k,why,wrong,topic});
const A=[
q("A01","A","A £72,000 set-up pool has 120 set-ups. A £90,000 inspection pool has 300 inspections. Alpha uses 30 set-ups and 90 inspections.","What overhead is assigned to Alpha?",["£27,000","£45,000","£54,000","£72,000"],1,"Rates are £600 per set-up and £300 per inspection. Alpha receives £18,000 + £27,000 = £45,000.",["Omits one activity pool.","Correct.","Assigns all inspection costs to Alpha.","Assigns the entire set-up pool to Alpha."],"ABC"),
q("A02","A","Market price is £250 and required profit is 24% of selling price.","What is the target cost per unit?",["£190","£200","£210","£250"],0,"Target cost = £250 × 76% = £190.",["Correct.","Uses a 20% margin.","Deducts £40 instead of 24%.","Ignores the required margin."],"Target costing"),
q("A03","A","Product life-cycle revenue is £6.0m. Development £1.2m, design £0.8m, production £3.4m, marketing £0.5m and support £0.3m.","What is the life-cycle result?",["£200,000 profit","£200,000 loss","£400,000 profit","£400,000 loss"],1,"Costs total £6.2m, exceeding revenue by £200,000.",["Reverses the result.","Correct.","Understates total cost by £200,000.","Doubles the difference."],"Life-cycle costing"),
q("A04","A","A unit sells for £90, uses direct materials of £30 and takes two hours on the bottleneck.","What is its throughput return per bottleneck hour?",["£15","£30","£45","£60"],1,"Throughput is £90 − £30 = £60 per unit; per hour it is £30.",["Divides by four hours.","Correct.","Uses selling price less an unrelated amount.","Uses sales rather than throughput."],"Throughput accounting"),
q("A05","A","Inventory increases by 400 units. Fixed production overhead absorption is £12 per unit.","Compared with marginal costing, absorption profit is:",["£4,800 lower","£4,800 higher","The same","£12 higher"],1,"The increase in inventory defers £4,800 of fixed overhead, raising absorption profit.",["Reverses the direction.","Correct.","Inventory changes affect the treatment of fixed overhead.","Confuses unit rate and total."],"Absorption costing"),
q("A06","A","15 buses each have 40 seats, 75% average occupancy, travel 200 km daily and run 25 days.","Passenger-kilometres?",["900,000","1,500,000","2,250,000","3,000,000"],2,"15 × 40 × 75% × 200 × 25 = 2,250,000.",["Omits a major factor.","Omits the occupancy adjustment.","Correct.","Assumes full occupancy."],"Service costing"),
q("A07","A","Input is 4,000 kg. Normal loss is 5%. Actual output is 3,600 kg.","Abnormal loss?",["200 kg","300 kg","400 kg","600 kg"],0,"Normal loss is 200 kg; expected output is 3,800 kg, so abnormal loss is 200 kg.",["Correct.","Does not deduct normal loss.","This is total actual loss.","Adds normal loss twice."],"Process costing"),
q("A08","A","A product has a high defect rate.","Which is a prevention cost?",["Final inspection","Repairing returns","Operator quality training","Scrapping defects"],2,"Training aims to prevent defects before they occur.",["Appraisal cost.","External failure cost.","Correct.","Internal failure cost."],"Quality costing"),
q("A09","A","Price £50, variable cost £32, fixed costs £180,000.","Break-even units?",["8,000","10,000","12,000","15,000"],1,"Contribution is £18; £180,000 ÷ £18 = 10,000.",["Uses the wrong contribution.","Correct.","Uses fixed cost of £216,000.","Uses price instead of contribution."],"CVP"),
q("A10","A","Price £40, variable cost £24, fixed costs £192,000 and expected sales 15,000 units.","Margin of safety percentage?",["10%","20%","25%","40%"],1,"Break-even is 12,000 units. (15,000−12,000) ÷ 15,000 = 20%.",["Wrong denominator or break-even.","Correct.","Divides by break-even sales.","Uses a wrong break-even volume."],"CVP"),
q("A11","A","Constant sales mix: two A and one B. A price £100, variable cost £60; B price £160, variable cost £80.","Weighted average C/S ratio?",["40.0%","44.4%","50.0%","55.6%"],1,"A bundle has contribution £160 and revenue £360: 44.4%.",["Uses A’s ratio only.","Correct.","Overstates contribution or understates sales.","Inverts the ratio."],"CVP"),
q("A12","A","Price rises from £20 to £22 and demand falls from 10,000 to 9,000 units. Use original values as base.","Price elasticity?",["−0.5","−1.0","+1.0","+2.0"],1,"Quantity changes −10%, price +10%; elasticity is −1.0.",["Halves the quantity response.","Correct.","Omits the inverse sign.","Doubles the response."],"Pricing"),
q("A13","A","Contribution / bottleneck hours: P £30 / 2, Q £50 / 5, R £36 / 3.","Priority order?",["Q, R, P","P, R, Q","R, P, Q","P, Q, R"],1,"Returns per hour are P £15, R £12, Q £10.",["Ranks unit contribution only.","Correct.","P earns more per hour than R.","Q earns less per hour than R."],"Limiting factors"),
q("A14","A","Contribution: X £30, Y £40. Constraints x+2y≤100 and 2x+y≤100. Non-negative quantities.","Which point maximises contribution?",["(50,0)","(0,50)","(33⅓,33⅓)","(0,0)"],2,"At the constraint intersection contribution is about £2,333, above either axis point.",["Contribution is £1,500.","Contribution is £2,000.","Correct.","Produces no contribution."],"Linear programming"),
q("A15","A","A special order uses 100 kg in stores. Historic cost £5/kg. It has no other use and could be sold for £2/kg.","Relevant material cost?",["£200","£500","£700","£0"],0,"Use sacrifices resale proceeds of £2/kg; historic cost is sunk.",["Correct.","Historic cost is sunk.","Adds historic cost to opportunity cost.","The resale value is relevant."],"Relevant costing"),
q("A16","A","Make 5,000 units: £10 variable each; £10,000 avoidable fixed and £20,000 unavoidable. Buy price £14 each.","Advantage of making?",["Buy saves £10,000","Make saves £10,000","Make saves £20,000","No difference"],1,"Relevant make cost is £60,000 versus £70,000 to buy.",["Reverses the comparison.","Correct.","Treats unavoidable fixed cost as avoidable.","Ignores the cost difference."],"Relevant costing"),
q("A17","A","A line contributes £65,000. Closing saves £80,000 avoidable fixed cost and incurs £5,000 closure costs.","Effect of closing?",["Profit falls £20,000","Profit rises £10,000","Profit rises £15,000","No effect"],1,"Net benefit = £80,000 − £65,000 − £5,000 = £10,000.",["Wrong direction and amount.","Correct.","Omits lost contribution.","Ignores closure cost and contribution."],"Relevant costing"),
q("A18","A","Project A pays £50,000 with probability .6 and loses £10,000 otherwise. Project B pays £20,000 for certain.","Higher expected value?",["A, £26,000","A, £20,000","B, £20,000","Equal"],0,"EV(A) = .6×50,000 + .4×(−10,000) = £26,000.",["Correct.","Omits the loss state.","B is certain but lower EV.","The expected values differ."],"Risk"),
q("A19","A","Payoffs by two states: P £100k/£20k; Q £70k/£60k; R £130k/−£10k.","Maximin choice?",["P","Q","R","All"],1,"Minimum payoffs are £20k, £60k and −£10k; Q has the highest minimum.",["P’s worst case is lower.","Correct.","R has a negative worst case.","Maximin selects one alternative."],"Risk"),
q("A20","A","First unit takes 100 hours. 80% learning curve applies to cumulative average time when output doubles, through four units.","Total hours for four units?",["64","128","256","320"],2,"Four-unit cumulative average is 100×.8×.8 = 64 hours; total is 4×64 = 256.",["This is the average, not total.","Applies one learning step.","Correct.","Does not apply the curve correctly."],"Learning curves"),
q("A21","A","Flexible budget variable cost £7/unit, fixed cost £48,000; actual volume 12,000 units.","Flexed cost?",["£84,000","£132,000","£144,000","£180,000"],1,"12,000×£7 + £48,000 = £132,000.",["Omits fixed cost.","Correct.","Uses £8 variable cost.","Overstates activity."],"Budgeting"),
q("A22","A","Standard usage is 1 kg per unit at £4/kg. Actual output 4,000 units used 4,400 kg.","Material usage variance?",["£1,600 F","£1,600 A","£4,800 A","£400 A"],1,"Excess usage is 400 kg × £4 = £1,600 adverse.",["Actual usage exceeds standard.","Correct.","Values total actual usage, not excess.","Does not value excess at standard price."],"Material variances"),
q("A23","A","Actual labour 2,100 hours at £14/hour; standard rate £15/hour.","Labour rate variance?",["£2,100 F","£2,100 A","£1,500 F","£1,500 A"],0,"Actual rate is £1 below standard for 2,100 hours, favourable £2,100.",["Correct.","Lower actual rate is favourable.","Wrong hours or rate difference.","Reverses the sign."],"Labour variances"),
q("A24","A","Budget fixed overhead £7,200 at 900 units. Actual output 1,000 units.","Fixed overhead volume variance?",["£800 A","£800 F","£1,000 F","£7,200 A"],1,"Rate is £8/unit; £8,000 absorbed versus £7,200 budget is £800 favourable.",["Higher output causes more absorption.","Correct.","Compares units directly with costs.","Gives the budget amount, not variance."],"Overhead variances"),
q("A25","A","Standard contribution A £12, B £20. Standard mix 60:60. Actual mix 70:50; total units unchanged.","Sales mix contribution variance?",["£80 F","£80 A","£120 F","£200 A"],1,"(70−60)×£12 +(50−60)×£20 = £80 adverse.",["Reverses net effect.","Correct.","Ignores the lower B volume.","Ignores the extra A contribution."],"Sales mix"),
q("A26","A","A project earns £100,000 on additional investment £400,000. Required return is 18%.","Project residual income?",["£28,000","£72,000","£100,000","£172,000"],0,"RI = £100,000 − (18%×£400,000) = £28,000.",["Correct.","This is the capital charge.","Ignores capital charge.","Adds capital charge."],"Performance measurement"),
q("A27","A","A company measures staff development in a balanced scorecard.","Learning and growth measure?",["Operating margin","Complaint rate","Staff completing skills training","Production cycle time"],2,"Staff skills development is a learning and growth measure.",["Financial perspective.","Customer perspective.","Correct.","Internal process perspective."],"Balanced scorecard"),
q("A28","A","A public service measures cost, quantity delivered and achievement of service goals.","Effectiveness is:",["Achieving objectives and outcomes","Minimising input prices","Maximising output per resource","Comparing actual to budget"],0,"Effectiveness asks whether intended objectives and outcomes are achieved.",["Correct.","Economy.","Efficiency.","Budgetary control."],"Value for money"),
q("A29","A","Millions of live sales records arrive from stores each minute and feed hourly forecasts.","Which big data feature is rapid arrival?",["Volume","Variety","Velocity","Veracity"],2,"Velocity is the speed of data generation and processing.",["Amount of data.","Types and sources.","Correct.","Reliability and quality."],"Data analytics"),
q("A30","A","A factory wants to trace the cost of material waste at each production stage.","Best method?",["Material flow cost accounting","Balanced scorecard","Learning curve","Residual income"],0,"Material flow cost accounting traces physical flows and costs of losses and outputs.",["Correct.","A broader performance framework.","Models time and learning.","Measures profit after capital charge."],"Environmental accounting")
];
const B=[
{title:"Norvale Co: cost and price",sc:"<p><b>The following scenario relates to five requirements.</b></p><p>Norvale makes Dune and Alto. Its activity pools are order processing £96,000 for 120 orders and inspection £60,000 for 300 inspections.</p><table><tr><th></th><th>Dune</th><th>Alto</th></tr><tr><td>Orders</td><td>40</td><td>80</td></tr><tr><td>Inspections</td><td>100</td><td>200</td></tr><tr><td>Units</td><td>800</td><td>2,000</td></tr></table><p>Dune direct material and labour are £50 and £30 per unit. Current price is £180; product-sustaining fixed cost is £52,000. A new version has the same full cost and a 25% required sales margin.</p>",items:[
q("B1.1","B","","ABC overhead per Dune unit?",["£52","£65","£80","£120"],1,"Dune receives £32,000 order cost and £20,000 inspection cost; £52,000 ÷ 800 = £65.",["Uses only one pool.","Correct.","Misstates the pool allocation.","Allocates all overhead to Dune."],"ABC"),
q("B1.2","B","","Dune full cost per unit?",["£80","£130","£145","£165"],2,"£50 + £30 + £65 = £145.",["Omits direct costs.","Omits some cost.","Correct.","Adds unsupported costs."],"ABC"),
q("B1.3","B","","Price to earn 25% margin on selling price at cost £145?",["£181.25","£193.33","£206.25","£232"],1,"Price = £145 ÷ .75 = £193.33.",["Uses a 25% mark-up on cost.","Correct.","Uses a different margin.","Uses a different margin."],"Pricing"),
q("B1.4","B","","Break-even units at £180 price?",["400","520","650","800"],1,"Contribution before fixed cost is £100; £52,000 ÷ £100 = 520.",["Uses wrong contribution.","Correct.","Uses £80 contribution.","Uses full cost."],"CVP"),
q("B1.5","B","","Why might Dune have higher ABC overhead per unit?",["ABC allocates by units only","Dune uses more activity per unit","ABC excludes batch costs","Dune price is higher"],1,"Dune consumes more order and inspection activity per unit than Alto.",["ABC uses activity drivers.","Correct.","ABC includes batch-level drivers.","Price does not drive activity overhead."],"ABC")
]},
{title:"Mero Co: machine capacity",sc:"<p><b>The following scenario relates to five requirements.</b></p><p>Mero makes Lift and Link. Only 1,200 specialist machine hours are available.</p><table><tr><th></th><th>Lift</th><th>Link</th></tr><tr><td>Price</td><td>£150</td><td>£110</td></tr><tr><td>Variable cost</td><td>£90</td><td>£65</td></tr><tr><td>Hours per unit</td><td>3</td><td>2</td></tr><tr><td>Maximum demand</td><td>250</td><td>300</td></tr></table><p>Extra hours can be bought for £8/hour up to 150 hours. Additional Lift units can be sold.</p>",items:[
q("B2.1","B","","Which product receives machine hours first?",["Lift, higher unit contribution","Link, £22.50 per hour","Lift, more hours per unit","Equal return"],1,"Lift earns £20/hour; Link earns £22.50/hour.",["Unit contribution ignores hours.","Correct.","Hours per unit alone is not the rule.","Returns differ."],"Limiting factors"),
q("B2.2","B","","Optimal output with 1,200 hours?",["250 Lift, 225 Link","200 Lift, 300 Link","250 Lift, 150 Link","200 Lift, 200 Link"],1,"Make 300 Link using 600 hours, then 200 Lift using 600 hours.",["Does not prioritise higher return Link.","Correct.","Leaves capacity unused.","Does not use all available hours."],"Limiting factors"),
q("B2.3","B","","Total contribution at the optimum?",["£22,500","£25,500","£27,000","£30,000"],1,"200×£60 + 300×£45 = £25,500.",["Omits some contribution.","Correct.","Overstates quantities.","Uses selling prices."],"Limiting factors"),
q("B2.4","B","","Contribution per extra machine hour before its cost?",["£12","£20","£22.50","£45"],1,"Unsatisfied demand is Lift; its contribution per hour is £60÷3 = £20.",["Deducts the hour purchase cost.","Correct.","Link demand is already met.","This is contribution per unit."],"Limiting factors"),
q("B2.5","B","","Profit increase from buying 100 extra hours?",["£800","£1,200","£2,000","£2,800"],1,"100 hours enable 33⅓ Lift, contributing £2,000. Cost is £800; net £1,200.",["Ignores additional contribution.","Correct.","Ignores cost of hours.","Adds the cost to contribution."],"Relevant costing")
]},
{title:"Vela Co: operating variances",sc:"<p><b>The following scenario relates to five requirements.</b></p><p>Plan: 4,000 units at £50 selling price. Actual: 4,200 units at £48. Standard materials are 3 kg at £4/kg per unit; actual 12,900 kg at £4.20/kg. Standard labour is 2 hours at £10/hour per unit; actual 8,600 hours at £10.50/hour.</p>",items:[

function buildReview(r){let h="<h2>Question-by-question review</h2>";for(let x of flat){if(x.sec==="C"){let cs=cScore(x),txt=(S.rich[x.id]||"").replace(/<[^>]*>/g," ").trim();h+='<details><summary>'+esc(x.id+" · "+x.title+" · "+cs.marks+"/20 indicative")+'</summary><div class=inside><p><b>Your response:</b> '+(txt?esc(txt.slice(0,1200)):"No written response saved.")+'</p><p><b>Indicative guide:</b> '+esc(x.guide)+'</p><table class=guide><tr><th>Criterion</th><th>Marks</th><th>Comparison</th></tr>'+cs.rows.map(y=>'<tr><td>'+esc(y.n)+'</td><td>'+y.e+" / "+y.m+'</td><td class="'+(y.e?"match":"miss")+'">'+(y.e?"Evidence found":"Not detected")+"</td></tr>").join("")+"</table><p>Spreadsheet cells saved: "+Object.keys(S.sheets[x.id]||{}).length+"</p></div></details>";continue}let a=S.answers[x.id],status=a===undefined?"Unanswered":a===x.k?"Correct":"Incorrect";h+='<details><summary>'+esc(x.id+" · "+x.topic+" · "+status)+'</summary><div class=inside><p><b>'+esc(x.p)+'</b></p><ol type=A>'+x.opts.map((v,i)=>'<li class="'+(i===x.k?"good":i===a?"bad":"")+'">'+String.fromCharCode(65+i)+". "+esc(v)+(i===x.k?" — correct":i===a?" — your answer":"")+"</li>").join("")+'</ol><div class=reason><b>Explanation:</b> '+esc(x.why)+'</div><ul>'+x.opts.map((v,i)=>i===x.k?"":'<li><b>'+String.fromCharCode(65+i)+".</b> "+esc(x.wrong.length===x.opts.length?x.wrong[i]:x.wrong.filter((_,j)=>j!==x.k)[i<x.k?i:i-1]||"This distractor does not apply the stated method correctly.")+"</li>").join("")+"</ul></div></details>"}r.innerHTML=h}

document.addEventListener("focusin",e=>{let t=e.target;if(t&&(t.isContentEditable||t.tagName==="INPUT"||t.tagName==="TEXTAREA"))lastEditable=t});document.addEventListener("selectionchange",()=>{let s=window.getSelection();if(s&&s.rangeCount)insertRange=s.getRangeAt(0).cloneRange()});document.addEventListener("click",e=>{let act=e.target.closest("[data-act]")?.dataset.act;if(act){if(act==="scratch")openScratch();if(act==="symbols")symbols();if(act==="calc")calculator();if(act==="close")close();if(act==="highlight")document.execCommand("backColor",false,color);if(act==="strike")document.execCommand("strikeThrough");if(act==="flag"){let x=current();S.flags[x.id]=!S.flags[x.id];putStore();draw()}if(act==="ask-submit")askSubmit();if(act==="submit")submit(false)}let go=e.target.closest("[data-goto]");if(go){at=+go.dataset.goto;close();draw()}let key=e.target.closest("[data-key]");if(key)keyCalc(key.dataset.key);let sym=e.target.closest("[data-symbol]");if(sym){let target=insertTarget;if(target?.isContentEditable){target.focus();let selection=window.getSelection();if(insertRange&&selection){selection.removeAllRanges();selection.addRange(insertRange)}document.execCommand("insertText",false,sym.dataset.symbol);if(target===el("editor")&&current().sec==="C"){S.rich[current().id]=target.innerHTML;putStore()}if(target===el("scratch")){S.notes=target.value;putStore()}}else if(target&&(target.tagName==="INPUT"||target.tagName==="TEXTAREA")){let start=target.selectionStart??target.value.length,end=target.selectionEnd??start;target.setRangeText(sym.dataset.symbol,start,end,"end");target.dispatchEvent(new Event("input",{bubbles:true}));target.focus()}close()}let fmtbtn=e.target.closest("[data-format]");if(fmtbtn){document.execCommand(fmtbtn.dataset.format,false,null);el("editor")?.focus()}});
el("startBtn").onclick=start;el("prev").onclick=()=>navigate(-1);el("next").onclick=()=>navigate(1);el("navigator").onclick=navigatorOpen;el("question").onchange=e=>{if(e.target.matches('[name="ans"]'))saveAnswer(current(),+e.target.value)};el("shade").onclick=e=>{if(e.target===el("shade"))close()};el("colour").onchange=e=>{color=e.target.value;document.querySelector(".chip").style.background=color};document.addEventListener("keydown",e=>{if(e.key==="Escape")close();if(e.altKey&&e.key==="ArrowLeft")navigate(-1);if(e.altKey&&e.key==="ArrowRight")navigate(1)});
let drag=false;el("split").onpointerdown=e=>{drag=true;el("split").setPointerCapture(e.pointerId)};el("split").onpointermove=e=>{if(!drag)return;let r=el("body").getBoundingClientRect(),n=Math.max(25,Math.min(70,(e.clientX-r.left)/r.width*100));el("scenario").style.width=n+"%";el("question").style.width=(100-n)+"%";S.split=n;putStore()};el("split").onpointerup=()=>drag=false;
function restore(){let s=getStore();if(s?.v===1&&s.status==="submitted"){S=s;showResults()}else if(s?.v===1&&s.status==="running"&&s.deadline>Date.now()){S=s;at=Math.min(s.at||0,flat.length-1);el("start").style.display="none";el("exam").style.display="flex";el("scenario").style.width=(s.split||45)+"%";el("question").style.width=(100-(s.split||45))+"%";draw();timerStart()}}
restore();window.PMPracticeTest={count:flat.length,max:130,formula:(s,c)=>formula(s,r=>(c||{})[r]||0),score:()=>S?score():null};
</script></body></html>
